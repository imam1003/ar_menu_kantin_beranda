<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto AR</title>
    <link rel="stylesheet" href="ar.css">
    <script type="module" src="ar.js"></script>
</head>
<body>
    <main id="controls">
        <h1>Foto AR</h1>
        <label for="photo-file">Pilih foto</label>
        <input id="photo-file" type="file" accept="image/*">
        <button id="start-ar" type="button">Mulai AR</button>
        <p id="status" role="status">Memuat foto contoh...</p>
        <p class="hint">Arahkan kamera ke lantai atau meja, lalu ketuk layar untuk meletakkan foto.</p>
    </main>
</body>
</html>
